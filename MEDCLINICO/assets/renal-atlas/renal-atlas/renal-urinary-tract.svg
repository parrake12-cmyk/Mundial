<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Atlas renal: via urinaria completa</title>
  <desc id="desc">Vista de rinones, ureteres, vejiga y uretra para seguir el recorrido de la orina.</desc>
  <defs>
    <radialGradient id="kidney" cx="36%" cy="30%" r="76%">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset=".5" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </radialGradient>
    <linearGradient id="urine" x1="0" x2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".7" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <style>
      .label{font:700 27px Arial,sans-serif;fill:#172033;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
      .leader{fill:none;stroke:#facc15;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:url(#urine);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="#f8fbff"/>
  <ellipse cx="600" cy="700" rx="460" ry="34" fill="#e5edf7"/>
  <path d="M404 108C278 142 248 307 318 416c61 95 195 65 214-42 14-73-39-101-1-161 45-72-30-134-127-105Z" fill="url(#kidney)" stroke="#7f1d1d" stroke-width="9"/>
  <path d="M796 108c126 34 156 199 86 308-61 95-195 65-214-42-14-73 39-101 1-161-45-72 30-134 127-105Z" fill="url(#kidney)" stroke="#7f1d1d" stroke-width="9"/>
  <path d="M480 382C446 485 456 575 548 616" class="flow"/>
  <path d="M720 382c34 103 24 193-68 234" class="flow"/>
  <path d="M520 606c42-60 118-60 160 0 56 82-20 124-80 124s-136-42-80-124Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="9"/>
  <path d="M600 720c0 24 4 34 12 48" fill="none" stroke="#1d4ed8" stroke-width="15" stroke-linecap="round"/>
  <path d="M468 292c-52-12-94-5-129 22" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <path d="M732 292c52-12 94-5 129 22" fill="none" stroke="#dc2626" stroke-width="14" stroke-linecap="round"/>
  <g>
    <text x="388" y="58" class="label" style="font-size:34px">Via urinaria completa</text>
    <path class="leader" d="M242 148L356 132"/><text class="label" x="88" y="150">Rinon izquierdo</text>
    <path class="leader" d="M958 148L844 132"/><text class="label" x="890" y="150">Rinon derecho</text>
    <path class="leader" d="M264 332L362 318"/><text class="label" x="74" y="340">Hilio renal</text>
    <path class="leader" d="M330 520L475 500"/><text class="label" x="80" y="530">Ureter izquierdo</text>
    <path class="leader" d="M872 520L725 500"/><text class="label" x="826" y="530">Ureter derecho</text>
    <path class="leader" d="M424 650L544 640"/><text class="label" x="208" y="660">Vejiga</text>
    <path class="leader" d="M712 720L612 720"/><text class="label" x="740" y="728">Uretra</text>
    <text x="360" y="748" class="label" style="font-size:22px">Recorrido: pelvis renal -> ureter -> vejiga -> uretra</text>
  </g>
</svg>
