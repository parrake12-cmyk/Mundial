<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Atlas renal: anatomia externa</title>
  <desc id="desc">Vista externa bilateral del rinon con capsula, hilio, arteria renal, vena renal y ureter proximal.</desc>
  <defs>
    <radialGradient id="kidney" cx="36%" cy="30%" r="76%">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset=".48" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </radialGradient>
    <linearGradient id="ureter" x1="0" x2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".7" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <style>
      .label{font:700 27px Arial,sans-serif;fill:#172033;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
      .small{font:700 22px Arial,sans-serif}
      .leader{fill:none;stroke:#facc15;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .leader-blue{stroke:#2563eb}.leader-red{stroke:#dc2626}.leader-amber{stroke:#f59e0b}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="#f8fbff"/>
  <ellipse cx="600" cy="690" rx="460" ry="34" fill="#e5edf7"/>
  <g filter="url(#softShadow)">
    <path d="M440 120C281 162 241 372 330 512c77 121 248 82 273-54 18-93-50-129-2-206 58-91-38-170-161-132Z" fill="url(#kidney)" stroke="#7f1d1d" stroke-width="9"/>
    <path d="M760 120c159 42 199 252 110 392-77 121-248 82-273-54-18-93 50-129 2-206-58-91 38-170 161-132Z" fill="url(#kidney)" stroke="#7f1d1d" stroke-width="9"/>
    <path d="M483 206c-78 52-92 185-40 267 49 78 124 52 114-30-8-68-58-82-20-141" fill="#fecaca" stroke="#991b1b" stroke-width="6" opacity=".83"/>
    <path d="M717 206c78 52 92 185 40 267-49 78-124 52-114-30 8-68 58-82 20-141" fill="#fecaca" stroke="#991b1b" stroke-width="6" opacity=".83"/>
    <path d="M572 436c-8 84-36 160-96 245" fill="none" stroke="url(#ureter)" stroke-width="18" stroke-linecap="round"/>
    <path d="M628 436c8 84 36 160 96 245" fill="none" stroke="url(#ureter)" stroke-width="18" stroke-linecap="round"/>
    <path d="M595 330c-73-30-160-30-235 5" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <path d="M605 330c73-30 160-30 235 5" fill="none" stroke="#dc2626" stroke-width="18" stroke-linecap="round"/>
    <path d="M398 190c-72 88-70 250 7 340M802 190c72 88 70 250-7 340" fill="none" stroke="#fee2e2" stroke-width="18" opacity=".32"/>
  </g>
  <g>
    <path class="leader" d="M222 150L372 208"/><text class="label" x="52" y="148">Capsula renal</text>
    <path class="leader leader-blue" d="M170 330L360 334"/><text class="label" x="54" y="338">Vena renal</text>
    <path class="leader leader-red" d="M900 334L824 334"/><text class="label" x="914" y="340">Arteria renal</text>
    <path class="leader" d="M900 450L760 424"/><text class="label" x="914" y="456">Hilio renal</text>
    <path class="leader leader-amber" d="M378 682L470 596"/><text class="label" x="118" y="690">Ureter proximal</text>
    <path class="leader" d="M850 112L760 140"/><text class="label" x="872" y="118">Rinon derecho</text>
    <path class="leader" d="M346 104L440 120"/><text class="label" x="112" y="104">Rinon izquierdo</text>
  </g>
  <text x="420" y="50" class="label" style="font-size:34px">Anatomia externa renal</text>
</svg>
